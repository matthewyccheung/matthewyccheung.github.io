featured_publications:
- title: Conformal Certification of Reasoning Trace Prefixes
  venue: EMNLP (Oral, Outstanding Paper 🏆)
  year: 2026
  image: assets/img/publication_preview/crop_overview.png
  image_alt: Conformal Certification of Reasoning Trace Prefixes
  description: A conformal prediction framework for certifying the reliability of reasoning trace prefixes in large language models, providing statistical guarantees on the correctness of intermediate reasoning steps and enabling early stopping when confidence is low.
  links:
  - label: arXiv
    url: https://aclanthology.org/2026.emnlp-main.1776/
  - label: GitHub
    url: https://github.com/matthewyccheung/crop
- title: Efficient Conformal Volumetry for Template-Based Segmentation
  venue: MICCAI (Spotlight 💡)
  year: 2026
  image: assets/img/publication_preview/convolt.png
  image_alt: Efficient Conformal Volumetry for Template-Based Segmentation
  description: Efficient conformal uncertainty quantification for volumetry in template-based segmentation pipelines, producing prediction sets with guaranteed coverage while staying practical for large-scale medical imaging workflows.
  links:
  - label: arXiv
    url: https://arxiv.org/abs/2603.00798
  - label: Proceedings
    url: https://link.springer.com/chapter/10.1007/978-3-032-38085-2_17
  - label: GitHub
    url: https://github.com/matthewyccheung/convolt
- title: 'COMPASS: Robust Feature Conformal Prediction for Medical Segmentation Metrics'
  venue: ICLR
  year: 2026
  image: assets/img/compass.png
  image_alt: COMPASS overview
  description: A feature-based conformal framework for building reliable prediction intervals and sets for segmentation metrics, designed to remain robust under distribution shift and aligned with clinical evaluation metrics.
  links:
  - label: OpenReview
    url: https://openreview.net/forum?id=uBy4TCgGiT&noteId=uBy4TCgGiT
  - label: arXiv
    url: https://arxiv.org/abs/2509.22240
  - label: Proceedings
    url: https://proceedings.iclr.cc/paper_files/paper/2026/hash/d95c3d1d599b4f98adc253d2eb269558-Abstract-Conference.html
  - label: GitHub
    url: https://github.com/matthewyccheung/compass
- title: Bias-Aware Conformal Prediction for Metric-Based Imaging Pipelines
  venue: IEEE ISBI (Oral 🗣️)
  year: 2026
  image: assets/img/bias_fig.png
  image_alt: Bias-Aware Conformal Prediction for Metric-Based Imaging Pipelines
  description: Conformal calibration for metric-based imaging pipelines with explicit attention to bias, aiming to preserve statistical guarantees while accounting for heterogeneous errors across cohorts and measurement conditions.
  links:
  - label: arXiv
    url: https://arxiv.org/abs/2410.05263
  - label: Proceedings
    url: https://ieeexplore.ieee.org/abstract/document/11515847
- title: Metric-Guided Conformal Bounds for Probabilistic Image Reconstruction
  venue: UNSURE @ MICCAI (Long Oral 🗣️)
  year: 2025
  image: assets/img/metric_guidance_overview_fig.png
  image_alt: Metric-guided conformal bounds overview
  description: Instead of calibrating pixel-level uncertainty, this work calibrates conformal bounds on clinically meaningful derived metrics from probabilistic reconstructions, enabling interpretable uncertainty and flagging plausible-looking but statistically unlikely reconstructions.
  links:
  - label: arXiv
    url: https://arxiv.org/abs/2404.15274
  - label: Proceedings
    url: https://link.springer.com/chapter/10.1007/978-3-032-06593-3_16
  - label: GitHub
    url: https://github.com/matthewyccheung/conformal-metric
- title: When Are Diffusion Priors Helpful in Sparse Reconstruction? A Study with Sparse-view CT
  venue: IEEE ISBI
  year: 2025
  image: assets/img/halluphase_fig.png
  image_alt: Diffusion priors in sparse-view CT
  description: A systematic study of diffusion priors for sparse-view CT showing that diffusion can recover detail with very few projections, but can also plateau and produce convincing failure modes that require careful evaluation in high-stakes settings.
  links:
  - label: arXiv
    url: https://arxiv.org/abs/2502.02771
  - label: Proceedings
    url: https://ieeexplore.ieee.org/document/10981058
